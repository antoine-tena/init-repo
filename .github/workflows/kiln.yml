name: kiln

# Contrôles de kiln lui-même : ruff, mypy, tests du modèle (génération de chaque combinaison).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  kiln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Dépendances
        run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest -q

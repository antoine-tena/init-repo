[project]
name = "kiln"
version = "0.2.0"
description = "Orchestrateur de repos : génère un projet, règle ses paramètres et le tient à jour"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["copier>=9.4,<10", "packaging>=24"]

[project.scripts]
kiln = "kiln.cli:main"
charte = "kiln.charte.charte:lancer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"src/kiln/charte/*" = ["E501", "E741", "ANN", "B", "SIM", "RUF", "N", "UP"]

[tool.mypy]
strict = true

# Moteur de charte repris des dotfiles : typage et longueur de ligne à reprendre, module par
# module ([TYPAGE-STRICT], cliquet).
[[tool.mypy.overrides]]
module = ["kiln.charte.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["copier", "copier.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
